<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주기율표 마스터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>/* 단독 HTML 기본 설정 */
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one centered column on a dark lab-bench ground; the element tiles are the colour and the hero.
   Mendeleev's letter is the single warm-light object: cool paper, navy ink, a vermilion seal with his Cyrillic initials. */
:root{
  --bg:#0a0f1f; --panel:#111a35; --panel-2:#17234a; --line:#273868; --fg:#eef2ff; --muted:#98a5cc;
  --accent:#3ee0d0; --accent-2:#4aa8ff; --gold:#ffc857; --ok:#5ee5a0; --bad:#ff6b7a; --ink:#0a0f1f;
  --c-nonmetal:#5ee5a0; --c-alkali:#ff7b86; --c-alkaline:#ffbc5c; --c-metalloid:#c08cff; --c-halogen:#40e0d0;
  --c-noble:#6bb6ff; --c-post:#ffe066; --c-trans:#aebbdb; --c-lan:#f4a6d7; --c-act:#d8b48e;
  --paper:#e9edf5; --paper-2:#dde3f0; --paper-ink:#1b2a4d; --paper-mute:#53628a; --seal:#d6455a;
  --f-ui:'Noto Sans KR',system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --f-serif:'Nanum Myeongjo','Noto Serif KR','Batang',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(1100px 560px at 50% -8%,#16275a 0%,transparent 62%);background-repeat:no-repeat;color:var(--fg);font:400 15px/1.6 var(--f-ui);-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin-inline:auto;padding-inline:16px;padding-block:12px 56px}
.c-nonmetal{--cat:var(--c-nonmetal)}.c-alkali{--cat:var(--c-alkali)}.c-alkaline{--cat:var(--c-alkaline)}
.c-metalloid{--cat:var(--c-metalloid)}.c-halogen{--cat:var(--c-halogen)}.c-noble{--cat:var(--c-noble)}
.c-post{--cat:var(--c-post)}.c-trans{--cat:var(--c-trans)}.c-lan{--cat:var(--c-lan)}.c-act{--cat:var(--c-act)}

/* buttons */
.btn{appearance:none;border:0;cursor:pointer;border-radius:12px;padding:.8rem 1.4rem;font-weight:700;font-size:1rem;line-height:1.3;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));color:var(--ink);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.btn.sm{padding:.4rem .8rem;font-size:.85rem;border-radius:9px;font-weight:500}
.btn.danger{border-color:var(--bad);color:#ffb1ba}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end;margin-top:14px}

/* top bar */
.topbar{display:flex;align-items:center;gap:8px;padding-block:4px 14px}
.topbar .grow{flex:1}
.brand{font-weight:900;letter-spacing:-.01em}

/* start screen */
.start{max-width:440px;margin-inline:auto;display:grid;gap:18px}
.cover{display:block;width:100%;max-width:420px;height:auto;aspect-ratio:371/247;margin-inline:auto;border-radius:16px;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(62,224,208,.08),0 18px 50px rgba(0,0,0,.45)}
.tag{margin:0;text-align:center;color:var(--muted);font-size:.9rem;text-wrap:balance}
form{display:grid;gap:14px}
.field label{display:block;font-weight:500;font-size:.85rem;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:.8rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:1rem}
input::placeholder{color:#5f6c96}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(62,224,208,.25)}
.err{margin:0;color:var(--bad);min-height:1.3em;font-size:.88rem}
.foot{margin:0;text-align:center;color:var(--muted);font-size:.8rem}

/* game header */
.who{font:500 .85rem var(--f-mono);color:var(--muted);margin-bottom:10px}
.missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mcard{position:relative;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;min-width:0}
.mcard .k{display:block;font:500 .75rem var(--f-mono);letter-spacing:.05em;color:var(--muted)}
.mcard b{display:block;font-size:1rem;margin-top:2px}
.mcard small{display:block;color:var(--muted);font-size:.8rem}
.mcard.cur{border-color:var(--accent);background:var(--panel-2)}
.mcard.cur .k{color:var(--accent)}
.mcard.done .k{color:var(--ok)}
.mcard:disabled{opacity:.5;cursor:not-allowed}
.mcard svg{position:absolute;right:12px;top:12px;width:16px;height:16px;color:var(--muted)}
.prog{margin:12px 0 14px;color:var(--muted);font-size:.85rem}
.prog b{color:var(--fg);font-family:var(--f-mono)}
@media(max-width:640px){.missions{grid-template-columns:1fr}.mcard{padding:10px 14px}}

/* shared panels */
.info{padding:14px 16px;border:1px solid var(--line);background:var(--panel);border-radius:14px;line-height:1.75}
.info b{color:#fff}
.info .q{color:var(--accent)}
.say{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:.92rem;border:1px solid var(--line)}
.say:empty{display:none}
.say.ok{border-color:var(--ok);color:var(--ok)}
.say.bad{border-color:var(--bad);color:#ffb1ba}
.say.hint{border-color:var(--gold);color:#ffe3a3}
.card{padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}

/* periodic grid (20 elements) */
.ptwrap{container-type:inline-size;margin-top:16px}
.pt{display:grid;grid-template-columns:1.4rem repeat(9,minmax(0,1fr));gap:clamp(3px,1cqw,8px);max-width:780px;margin-inline:auto}
.pt .hd,.pt .rh{display:grid;place-items:center;font:500 .75rem var(--f-mono);color:var(--muted);background:none;border:0;padding:0;min-height:1.6rem}
.pt .rh{min-height:0}
button.hd{cursor:pointer;border-radius:8px}
button.hd:hover{color:var(--fg)}
button.hd.seen{color:var(--accent)}
button.hd.on{background:var(--accent);color:var(--ink);font-weight:600}
.tile{position:relative;display:grid;place-items:center;aspect-ratio:1/1.08;min-width:0;border:0;padding:0;border-radius:10px;background:var(--cat,var(--c-trans));color:var(--ink);font-family:var(--f-ui);line-height:1}
.tile .z{position:absolute;left:7%;top:6%;font:600 clamp(.5rem,1.6cqw,.68rem)/1 var(--f-mono);opacity:.72}
.tile .s{font-weight:900;font-size:clamp(.85rem,4cqw,1.9rem);letter-spacing:-.01em;margin-bottom:.5em}
.tile .n{position:absolute;bottom:7%;left:0;right:0;text-align:center;font-weight:500;font-size:clamp(.42rem,1.35cqw,.66rem);opacity:.8;white-space:nowrap}
@container (max-width:430px){.tile .n{display:none}.tile .s{margin-bottom:0}}
.slot{display:grid;place-items:center;aspect-ratio:1/1.08;min-width:0;padding:0;border-radius:10px;border:1.5px dashed #3a4c86;background:rgba(255,255,255,.03);color:#6a79a8;font:700 clamp(1rem,4cqw,1.7rem) var(--f-ui);cursor:pointer;transition:border-color .12s,background .12s,transform .12s}
.slot:hover{border-color:var(--accent)}
.slot.star{border:1.5px solid var(--gold);color:var(--gold);background:rgba(255,200,87,.07)}
.slot.over,.pt.picking .slot{border-color:var(--accent);background:rgba(62,224,208,.1)}
.slot.over{transform:scale(1.06)}
.pt .void{display:block}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* mission 1 tray */
.trayhead{display:flex;justify-content:space-between;gap:10px;margin:22px 0 8px;font-weight:700}
.trayhead .cnt{font:600 .9rem var(--f-mono);color:var(--accent)}
.tray{display:flex;flex-wrap:wrap;gap:10px;padding:14px;min-height:96px;border:1px solid var(--line);border-radius:14px;background:var(--panel);align-items:center}
.tray .none{color:var(--muted);font-size:.9rem;margin:0}
.tile.tray-tile{width:64px;height:72px;aspect-ratio:auto;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:box-shadow .12s,transform .12s}
.tray-tile .z{font-size:.62rem}.tray-tile .s{font-size:1.5rem;margin-bottom:.45em}.tray-tile .n{font-size:.6rem}
.tray-tile:hover{transform:translateY(-2px)}
.tray-tile.picked{box-shadow:0 0 0 3px var(--accent),0 0 18px rgba(62,224,208,.5)}
.tray-tile.dragging{opacity:.3}
.tile.ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-60%) scale(1.12) rotate(-4deg);box-shadow:0 14px 30px rgba(0,0,0,.55);width:64px;height:72px;aspect-ratio:auto}

/* mission 2 */
.m2top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.meter{flex:1;min-width:160px;height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
.m2top .cnt{font:600 .9rem var(--f-mono);color:var(--accent)}
.pt.has-sel .tile{opacity:.38;transition:opacity .2s,box-shadow .2s}
.pt.has-sel .tile.in-group{opacity:1;box-shadow:0 0 0 2px var(--accent),0 0 18px rgba(62,224,208,.55)}
.pt.has-sel .tile.sel{opacity:1;box-shadow:0 0 0 3px #fff,0 0 20px rgba(255,255,255,.45)}
.pt .tile{cursor:pointer}
.gbar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:16px}
.gchip{padding:.45rem 0;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font:600 .85rem var(--f-mono);color:var(--muted)}
.gchip:hover{border-color:var(--accent)}
.gchip.seen{color:var(--accent);border-color:rgba(62,224,208,.5)}
.gchip.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.gl{margin:18px 0 0;font-size:.8rem;color:var(--muted)}
.detail{margin-top:12px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.detail.empty{color:var(--muted)}
.detail.empty p{margin:0}
.detail h3{margin:0;font-size:1.5rem;line-height:1.25}
.detail .meta{margin:2px 0 10px;color:var(--muted);font-size:.9rem}
.detail p{margin:0 0 12px}
.gbox{padding:12px 14px;border-radius:12px;border:1px solid #6a4a52;background:#2a1a2e;margin-bottom:12px}
.gbox.cool{border-color:#2f5a78;background:#122c3f}
.gbox b{display:block;margin-bottom:4px}
.gbox span{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:.85rem;color:var(--muted)}
.chipbtn{padding:.25rem .65rem;border-radius:99px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:.85rem}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn.on{border-color:var(--accent);color:var(--accent);background:rgba(62,224,208,.1)}

/* mission 3 */
.intro h2{margin:2px 0 12px;font-size:1.5rem;line-height:1.3;text-wrap:balance}
.eyebrow{margin:0;font:500 .8rem var(--f-mono);letter-spacing:.06em;color:var(--accent)}
.rules{margin:0 0 14px;padding-left:1.2rem;display:grid;gap:6px}
.mine{margin:0 0 14px;font:500 .9rem var(--f-mono);color:var(--gold)}
.hud{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:.85rem;white-space:nowrap}
.chip b{margin-left:6px;font:600 1.05rem var(--f-mono);font-variant-numeric:tabular-nums}
.chip.stg{background:linear-gradient(90deg,#8e7bff,#4aa8ff);border:0;color:#0a0f1f;font-weight:700}
.chip.time b{color:var(--gold)}
.qcard{margin-top:10px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.qcard .lab{font:500 .8rem var(--f-ui);color:var(--accent);letter-spacing:.04em}
.qcard .name{font-weight:900;font-size:clamp(1.7rem,6.5vw,2.5rem);line-height:1.2}
.qcard .sub{color:var(--muted);font-size:.9rem;min-height:1.4em}
.qcard .sub.hint{color:#ffe3a3}
.bar{position:relative;height:9px;border-radius:99px;background:#0b1330;overflow:hidden;margin-top:10px}
.bar i{position:absolute;inset:0;background:linear-gradient(90deg,#5ee5a0,#ffe066 55%,#ff6b7a);clip-path:inset(0 0 0 0)}
.gridwrap{position:relative}
.quiz .tile{cursor:pointer;transition:transform .1s}
.quiz .tile:hover{transform:translateY(-2px)}
.quiz .tile:disabled{cursor:default;transform:none}
.tile.ok{box-shadow:0 0 0 3px var(--ok),0 0 24px var(--ok)}
.tile.bad{box-shadow:0 0 0 3px var(--bad),0 0 24px var(--bad);animation:shake .3s}
.float{position:absolute;z-index:5;transform:translateX(-50%);font:700 1.1rem var(--f-mono);pointer-events:none;animation:floatUp .8s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.float.ok{color:var(--ok)}.float.bad{color:var(--bad)}
@keyframes floatUp{0%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-42px}}
.count{position:absolute;inset:0;display:grid;place-items:center;z-index:6;background:rgba(10,15,31,.6);border-radius:14px;font:700 clamp(4rem,18vw,8rem) var(--f-mono);color:var(--accent)}

/* modals */
.modal-back{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(4,7,16,.74);backdrop-filter:blur(3px);overflow:auto}
.modal{width:100%;max-width:520px;max-height:calc(100% - 8px);overflow:auto;border-radius:18px;background:var(--panel);border:1px solid var(--line);padding:24px;animation:modalIn .25s ease-out}
@keyframes modalIn{0%{opacity:0;transform:translateY(10px) scale(.98)}100%{opacity:1;transform:none}}
.modal h2{margin:0 0 8px;font-size:1.35rem;line-height:1.3;text-wrap:balance}
.modal p{margin:0 0 12px}
.modal.gold{border-color:var(--gold)}
.modal.gold h2{color:var(--gold)}
.modal .q{font-weight:700;color:#fff}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.opt{padding:.9rem 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:1.05rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.bad{border-color:var(--bad);color:#ffb1ba;animation:shake .3s}
.opt.ok{border-color:var(--ok);background:rgba(94,229,160,.12);color:var(--ok)}
.opt:disabled{cursor:default}
.fb{min-height:3em;font-size:.92rem}
.fb.ok{color:var(--ok)}.fb.bad{color:#ffb1ba}
.clear{text-align:center}
.clear .burst{margin:0 0 4px;font-size:3rem;line-height:1;color:var(--gold)}
.clear .row{justify-content:center}
.score-big{font:700 clamp(2.6rem,12vw,3.8rem)/1.1 var(--f-mono);color:var(--accent);margin:4px 0;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 16px}
.stats div{padding:8px;border-radius:10px;background:var(--panel-2);text-align:center}
.stats small{display:block;color:var(--muted);font-size:.75rem}
.stats b{font:600 1.15rem var(--f-mono)}
.rank{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px;text-align:left}
.rank li{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:var(--panel-2);border:1px solid transparent}
.rank li.me{border-color:var(--accent)}
.rank .no{font:600 .95rem var(--f-mono);color:var(--muted)}
.rank li.top .no{color:var(--gold)}
.rank .who2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .who2 small{margin-left:8px;color:var(--muted);font-family:var(--f-mono)}
.rank .sc{font:700 1rem var(--f-mono);font-variant-numeric:tabular-nums}
.rank .gapli{display:block;text-align:center;color:var(--muted);background:none;padding:0;font-size:.8rem}
.empty-rank{margin:0 0 14px;padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.note{color:var(--muted);font-size:.82rem}

/* full table modal */
.modal.wide{max-width:960px}
.ftscroll{overflow-x:auto;padding-bottom:6px}
.ft{display:grid;grid-template-columns:repeat(18,minmax(40px,1fr));gap:4px;min-width:780px}
.ft .fh{text-align:center;font:500 .7rem var(--f-mono);color:var(--muted)}
.ftile{position:relative;aspect-ratio:1/1.05;border:0;padding:0;border-radius:6px;background:var(--cat);color:var(--ink);display:grid;place-items:center;cursor:pointer;line-height:1;font-family:var(--f-ui)}
.ftile .s{font-weight:900;font-size:.95rem;margin-top:.35em}
.ftile .z{position:absolute;left:4px;top:3px;font:600 .52rem var(--f-mono);opacity:.7}
.ftile.learn::after{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.ftile.on{box-shadow:0 0 0 3px #fff}
.ftph{display:grid;place-items:center;border:1px dashed var(--line);border-radius:6px;font:500 .55rem var(--f-mono);color:var(--muted);text-align:center}
.ftinfo{margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);min-height:3.4em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 12px;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--cat);margin-right:5px}

/* the letter */
.modal.letter{max-width:560px;padding:24px 28px 20px;background:linear-gradient(180deg,#eef1f8,var(--paper-2));color:var(--paper-ink);border:1px solid #b6c1d9;box-shadow:0 0 0 6px var(--paper),0 0 0 7px #98a6c6,0 30px 80px rgba(0,0,0,.6)}
.l-head{display:flex;align-items:center;gap:12px}
.dateline{font:700 .85rem var(--f-serif);letter-spacing:.04em;color:var(--paper-mute)}
.seal{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#ee6a7d,var(--seal) 60%,#a02a3d);color:#fff;font:800 .85rem var(--f-serif);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.l-x{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--paper-mute);font-size:1.4rem;line-height:1;padding:4px 8px;border-radius:8px}
.l-body{min-height:18rem;margin-block:14px 8px}
.l-body.fwd{animation:pageIn .35s ease}
.l-body.back{animation:pageBack .35s ease}
@keyframes pageIn{0%{opacity:0;transform:translateX(18px)}100%{opacity:1;transform:none}}
@keyframes pageBack{0%{opacity:0;transform:translateX(-18px)}100%{opacity:1;transform:none}}
.letter h2{font:800 clamp(1.4rem,5vw,1.85rem)/1.35 var(--f-serif);color:var(--paper-ink);margin:0 0 10px}
.letter .body{font:400 1.0625rem/1.95 var(--f-serif);margin:0 0 10px}
.letter .sign{text-align:right;font:700 1rem var(--f-serif);color:var(--paper-mute);margin:6px 0 0}
.l-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#b3bed6}
.dots i.on{background:var(--paper-ink);width:22px;border-radius:99px}
.l-btns{display:flex;gap:8px}
.letter .btn{background:var(--paper-ink);color:#fff}
.letter .btn.ghost{background:transparent;color:var(--paper-ink);border:1px solid #98a6c6}
.scene{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;min-height:58px;margin-bottom:16px}
.mini{position:relative;display:grid;place-items:center;width:42px;height:46px;border-radius:7px;background:var(--cat);color:var(--ink);font-family:var(--f-ui);transform:rotate(var(--r,0deg));box-shadow:0 1px 0 rgba(0,0,0,.25),0 4px 8px rgba(27,42,77,.2)}
.mini b{font-weight:900;font-size:1.05rem;line-height:1;margin-top:.25em}
.mini i{position:absolute;left:4px;top:3px;font:600 .5rem var(--f-mono);font-style:normal;opacity:.7}
.mini.sm{width:30px;height:34px}.mini.sm b{font-size:.82rem}.mini.sm i{display:none}
.mini.dim{filter:saturate(.15);opacity:.45;box-shadow:none}
.mini.gap{background:transparent;border:1.5px dashed #6b7aa0;color:#6b7aa0;box-shadow:none}
.mini.glow{box-shadow:0 0 0 2px #fff,0 0 16px 3px var(--cat)}
.cap{flex-basis:100%;text-align:center;margin-top:4px;font:500 .8rem var(--f-ui);color:var(--paper-mute)}
.stamp{display:inline-block;border:3px double var(--seal);color:var(--seal);font:800 2.2rem var(--f-serif);padding:.05em .5em;border-radius:6px;transform:rotate(-4deg);letter-spacing:.08em}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%;max-width:380px}
.mlist li{display:grid;grid-template-columns:2rem 1fr;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:#f6f8fc;border:1px solid #c3cde2;text-align:left}
.mlist .n{display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--paper-ink);color:#fff;font:600 .9rem var(--f-mono)}
.mlist b{display:block;font:700 .95rem var(--f-ui);line-height:1.3}
.mlist small{display:block;color:var(--paper-mute);font:400 .78rem var(--f-ui)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v=attrs[k];
    if(v===false||v==null) continue;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; e.append(c instanceof Node?c:String(c)); }
  return e;
};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  set(k,v){ mem[k]=v; try{ if(storageOK) localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

function beep(f,d,type,vol,when){
  if(!soundOn) return;

    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+(when||0), v=vol||.06;
    o.type=type||'sine'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t); o.stop(t+d+.03);
  }catch(e){}
}

function pos(z){

/* ---------- modal ---------- */
let current=null, lastFocus=null;
function openModal(node,opt){
  closeModal(true);
  opt=opt||{};
  const back=h('div',{class:'modal-back'},node);
  node.setAttribute('role','dialog'); node.setAttribute('aria-modal','true'); node.tabIndex=-1;
  back.addEventListener('pointerdown',e=>{ if(e.target===back&&opt.dismiss!==false) closeModal(); });
  lastFocus=document.activeElement;
  document.body.append(back); document.body.classList.add('lock');
  current={back,onClose:opt.onClose,onCleanup:opt.onCleanup,dismiss:opt.dismiss!==false};
  const af=node.querySelector('[data-autofocus]')||node;
  try{ af.focus({preventScroll:true}); }catch(e){}
}
function closeModal(silent){
  if(!current) return;
  const c=current; current=null;
  c.back.remove(); document.body.classList.remove('lock');
  if(c.onCleanup){ try{ c.onCleanup(); }catch(e){} }
  if(!silent&&c.onClose) c.onClose();
  if(!silent&&lastFocus&&lastFocus.focus&&document.contains(lastFocus)){ try{ lastFocus.focus({preventScroll:true}); }catch(e){} }
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&current&&current.dismiss) closeModal(); });

/* ---------- ranking (stored on this device) ---------- */
const RK='ptm.ranking.v1';
const getRank=()=>{ const l=store.get(RK,[]); return Array.isArray(l)?l:[]; };
const sortRank=l=>l.slice().sort((a,b)=>b.score-a.score||b.correct-a.correct||a.t-b.t);
function bestOf(id){ const r=getRank().find(x=>x.id===id); return r?r.score:null; }
function submitScore(rec){
  const list=getRank(); const i=list.findIndex(r=>r.id===rec.id); let improved=true;
  if(i>=0){ if(list[i].score>=rec.score){ improved=false; list[i].name=rec.name; } else list[i]=rec; } else list.push(rec);
  store.set(RK,list);
  const sorted=sortRank(list); const rank=sorted.findIndex(r=>r.id===rec.id)+1;
  return {rank,improved,best:sorted[rank-1].score,total:sorted.length};
}
function rankRow(r,i,meId){
  return h('li',{class:(i<3?'top ':'')+(r.id===meId?'me':'')},
    h('span',{class:'no',text:i+1}),
    h('span',{class:'who2',text:r.name},h('small',{text:r.id})),
    h('span',{class:'sc',text:r.score}));
}
function rankList(limit,meId){
  const sorted=sortRank(getRank());
  if(!sorted.length) return h('p',{class:'empty-rank',text:'아직 기록이 없어요. 첫 도전자가 되어 보세요!'});
  const ol=h('ol',{class:'rank'});
  sorted.slice(0,limit).forEach((r,i)=>ol.append(rankRow(r,i,meId)));
  const mi=sorted.findIndex(r=>r.id===meId);
  if(mi>=limit){ ol.append(h('li',{class:'gapli',text:'⋮'})); ol.append(rankRow(sorted[mi],mi,meId)); }
  return ol;
}
const DB=()=>window.PTM_DB||null;
function onlineList(rows,meId){
  if(!rows.length) return h('p',{class:'empty-rank',text:'아직 기록이 없어요. 첫 도전자가 되어 보세요!'});
  const ol=h('ol',{class:'rank'});
  rows.forEach((r,i)=>ol.append(h('li',{class:(i<3?'top ':'')+(r.id===meId?'me':'')},
    h('span',{class:'no',text:i+1}),
    h('span',{class:'who2',text:r.name},h('small',{text:r.sid})),
    h('span',{class:'sc',text:r.score}))));
  return ol;
}

function tileEl(el,o){
  o=o||{};
  const btn=o.tag==='button';
  return h(o.tag||'div',{class:'tile c-'+el.cat+(o.cls?' '+o.cls:''),'data-z':el.z,type:btn?'button':null,
      'aria-label':btn?(o.names===false?el.s+', '+el.z+'번':el.n+' '+el.s):null},
    h('span',{class:'z',text:el.z}),h('span',{class:'s',text:el.s}),o.names===false?null:h('span',{class:'n',text:el.n}));
}
const COLS={1:1,2:2,13:4,14:5,15:6,16:7,17:8,18:9};
const GHEAD=[1,2,null,13,14,15,16,17,18];
function buildPT(makeCell,headFn){
  const g=h('div',{class:'pt'});
  g.append(h('span',{class:'corner'}));
  GHEAD.forEach(x=>g.append(headFn(x)));
  for(let r=1;r<=4;r++){
    g.append(h('span',{class:'rh',text:r}));
    for(let c=1;c<=9;c++){
      const el=EL.find(e=>e.p===r&&COLS[e.g]===c);
      g.append(el?makeCell(el):h('span',{class:'void'}));
    }
  }
  return g;
}

function bindTray(tray){
  tray.addEventListener('pointerdown',e=>{
    const t=e.target.closest('.tray-tile'); if(!t||(e.button!=null&&e.button>0)) return;
    const z=+t.dataset.z, sx=e.clientX, sy=e.clientY, id=e.pointerId; let ghost=null, moved=false, over=null;
    const move=ev=>{
      if(ev.pointerId!==id) return;
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){
        moved=true; ghost=t.cloneNode(true); ghost.classList.add('ghost'); document.body.append(ghost); t.classList.add('dragging');
      }
      if(ghost){
        ghost.style.left=ev.clientX+'px'; ghost.style.top=ev.clientY+'px';
        const s=document.elementFromPoint(ev.clientX,ev.clientY); const sl=s&&s.closest?s.closest('.slot'):null;
        if(over!==sl){ if(over) over.classList.remove('over'); over=sl; if(over) over.classList.add('over'); }
      }
    };
    const up=ev=>{
      if(ev.pointerId!==id) return;
      window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
      if(over) over.classList.remove('over');
      if(ghost) ghost.remove(); t.classList.remove('dragging');
      if(moved){ const s=document.elementFromPoint(ev.clientX,ev.clientY); const sl=s&&s.closest?s.closest('.slot'):null; if(sl&&ev.type==='pointerup') m1Try(z,sl); }
      else if(ev.type==='pointerup') m1Pick(z);
    };
    window.addEventListener('pointermove',move); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  });
  tray.addEventListener('click',e=>{ const t=e.target.closest('.tray-tile'); if(t&&e.detail===0) m1Pick(+t.dataset.z); });
}

function pickM3(z,tile){
  if(M3.state!=='playing') return;
  if(z===M3.cur){
    const sec=(performance.now()-M3.qStart)/1000;
    const speed=Math.max(0,Math.round(50-Math.max(0,sec-1)*12.5));
    M3.combo++; M3.best=Math.max(M3.best,M3.combo);
    const gain=100+speed+Math.min(M3.combo-1,10)*10;
    M3.score+=gain; M3.correct++;
    M3.hud.score.textContent=M3.score; M3.hud.ok.textContent=M3.correct; M3.hud.combo.textContent=M3.combo;
    flash(tile,'ok'); floatText(tile,'+'+gain,'ok'); sfx.ok(); nextQ();
  } else {

    M3.hud.combo.textContent=0; flash(tile,'bad'); floatText(tile,'−2초','bad'); sfx.bad();

    openModal(h('div',{class:'modal clear'},
      h('h2',{text:cleared?'미션 3 클리어':'아쉬워요, 조금만 더!'}),
      cleared&&prog.cleared.size===3?h('p',{class:'q',text:'모든 미션 완료 — 진정한 주기율표 마스터 달성!'}):h('p',{text:NEED+'개 이상 찾으면 클리어예요. 다시 도전해 보세요.'}),
      h('div',{class:'score-big',text:score}),
      rankLine,
      h('div',{class:'stats'},h('div',{},h('small',{text:'맞힘'}),h('b',{text:correct})),h('div',{},h('small',{text:'최고 연속'}),h('b',{text:best})),h('div',{},h('small',{text:'정확도'}),h('b',{text:acc+'%'}))),
      rankBox,
      h('div',{class:'row'},
        h('button',{class:'btn','data-autofocus':true,type:'button',onclick:()=>{closeModal(true);startM3();}},'다시 도전'),
        h('button',{class:'btn ghost',type:'button',onclick:()=>closeModal()},'닫기'))
    ),{onClose:()=>{ if(M3.state==='done') renderM3(); }});
    if(score>0&&d){
      const me=d.idOf(player.id);
      d.submit({sid:player.id,name:player.name,score:score,correct:correct,best:best})
        .then(r=>d.top(5).then(rows=>{
          rankLine.textContent=(r.improved?'내 최고 기록이에요. ':'내 최고 기록은 '+r.best+'점이에요. ')+(r.rank?'전체 랭킹 '+r.rank+'위':'전체 50위 밖');
          rankBox.replaceChildren(onlineList(rows,me));
        }))
        .catch(()=>drawLocal('온라인 랭킹에 연결하지 못해 이 기기에만 저장했어요.'));
    }
  },700);
}

/* ======================= THE LETTER ======================= */
const mini=(s,z,cat,o)=>{o=o||{};return h('span',{class:'mini c-'+cat+(o.cls?' '+o.cls:''),style:o.r!=null?'--r:'+o.r+'deg':null},h('i',{text:z}),h('b',{text:s}))};
function scene(kind){
  const box=h('div',{class:'scene','aria-hidden':'true'});
  if(kind==='desk') box.append(h('span',{class:'stamp',text:'1869'}));
  else if(kind==='scatter') [['H',1,'nonmetal',-9],['Na',11,'alkali',6],['Fe',26,'trans',-4],['O',8,'nonmetal',10],['Cl',17,'halogen',-7],['Ca',20,'alkaline',5],['Cu',29,'trans',-10]].forEach(a=>box.append(mini(a[0],a[1],a[2],{r:a[3]})));
  else if(kind==='cards'){ [['H',1,'nonmetal'],['Li',7,'alkali'],['Be',9,'alkaline'],['B',11,'metalloid'],['C',12,'nonmetal'],['N',14,'nonmetal'],['O',16,'nonmetal'],['F',19,'halogen']].forEach(a=>box.append(mini(a[0],a[1],a[2]))); box.append(h('span',{class:'cap',text:'원자량이 작은 카드부터 차례로 늘어놓아요'})); }
  else if(kind==='period'){ const keep={Li:1,Na:1,K:1}; [['Li',3,'alkali'],['Be',4,'alkaline'],['B',5,'metalloid'],['C',6,'nonmetal'],['N',7,'nonmetal'],['O',8,'nonmetal'],['F',9,'halogen'],['Ne',10,'noble'],['Na',11,'alkali'],['Mg',12,'alkaline'],['Al',13,'post'],['Si',14,'metalloid'],['P',15,'nonmetal'],['S',16,'nonmetal'],['Cl',17,'halogen'],['Ar',18,'noble'],['K',19,'alkali']].forEach(a=>box.append(mini(a[0],a[1],a[2],{cls:'sm'+(keep[a[0]]?'':' dim')}))); box.append(h('span',{class:'cap',text:'Li → Na → K, 닮은 원소가 간격을 두고 다시 나타나요'})); }
  else if(kind==='gap'){ box.append(mini('Zn',30,'trans'),mini('?','','trans',{cls:'gap'}),mini('?','','trans',{cls:'gap'}),mini('As',33,'metalloid'),h('span',{class:'cap',text:'원자량 순서대로 놓았더니 두 칸이 비어요'})); }
  else if(kind==='found'){ box.append(mini('Zn',30,'trans'),mini('Ga',31,'post',{cls:'glow'}),mini('Ge',32,'metalloid',{cls:'glow'}),mini('As',33,'metalloid'),h('span',{class:'cap',text:'빈칸에서 갈륨(Ga)과 저마늄(Ge)이 발견됐어요'})); }
  else if(kind==='missions'){ box.append(h('ol',{class:'mlist'},[['멘델레예프의 빈칸','주기율표 완성'],['경향성 탐험','숨은 규칙 발견'],['위치 찾기 게임','속도 도전']].map((m,i)=>h('li',{},h('span',{class:'n',text:i+1}),h('span',{},h('b',{text:m[0]}),h('small',{text:m[1]})))))); }
  return box;
}
const LETTER=[
 {t:n=>'반갑네, '+n+'!',b:'나는 드미트리 멘델레예프라고 하네. 내가 살던 1869년의 책상으로 잠깐 함께 가 보겠나?',sign:1,sc:'desk'},
 {t:'제각각인 원소들',b:'그 시절엔 원소가 63종 알려져 있었지. 다들 따로 노는 듯했지만, 나는 그 속에 분명 숨은 규칙이 있다고 믿었네.',sc:'scatter'},
 {t:'카드처럼 줄을 세우다',b:'그래서 원소 하나하나를 카드에 적어 원자량 순서로 늘어놓기 시작했지. 카드놀이를 하듯, 밤새 자리를 바꿔 가며 말이야.',sc:'cards'},
 {t:'규칙이 보이기 시작했네',b:'그런데 놀라운 일이! 성질이 닮은 원소들이 일정한 간격마다 다시 나타나는 게 아니겠나. 나는 이것을 \'주기율\'이라 불렀네.',sc:'period'},
 {t:'빈칸을 비워 두다',b:'어떤 자리는 일부러 비워 뒀네. 사람들은 비웃었지만 나는 확신했지. "여기엔 아직 발견되지 않은 원소가 있고, 그 성질은 이럴 것이다!"',sc:'gap'},
 {t:'예측이 맞아떨어지다',b:'몇 해 뒤, 그 빈칸에서 갈륨과 저마늄이 정말로 모습을 드러냈네. 내 예측 그대로였지! 그제야 세상은 주기율표를 믿기 시작했네.',sc:'found'},
 {t:'이제 자네 차례일세',b:'나처럼 3개의 미션을 하나씩 풀어 주기율표의 비밀을 손에 넣어 보게. 준비됐나?',sign:1,sc:'missions'}
];
function openLetter(){
  let i=0; const paper=h('div',{class:'modal letter'});
  const onKey=e=>{ if(e.key==='ArrowRight'){ e.preventDefault(); go(1); } else if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); } };
  function go(d){
    const n=i+d; if(n<0) return;
    if(n>=LETTER.length){ document.removeEventListener('keydown',onKey); closeModal(true); startGame(); return; }
    i=n; sfx.flip(); draw(d<0?'back':'fwd');
  }
  function draw(dir){
    const p=LETTER[i], last=i===LETTER.length-1;
    const dots=h('div',{class:'dots','aria-hidden':'true'},LETTER.map((_,k)=>h('i',{class:k===i?'on':''})));
    const btns=h('div',{class:'l-btns'},
      i>0&&h('button',{class:'btn ghost',type:'button',onclick:()=>go(-1)},'이전'),
      h('button',{class:'btn','data-autofocus':true,type:'button',onclick:()=>go(1)},last?'미션 시작 →':'다음 →'));
    paper.replaceChildren(
      h('div',{class:'l-head'},h('span',{class:'seal','aria-hidden':'true',text:'Д·М'}),
        h('span',{class:'dateline',text:'1869년, 상트페테르부르크에서'}),
        h('button',{class:'l-x',type:'button','aria-label':'편지 닫기',text:'×',onclick:()=>closeModal()})),
      h('div',{class:'l-body '+(dir||'')},scene(p.sc),
        h('h2',{text:typeof p.t==='function'?p.t(player.name):p.t}),
        h('p',{class:'body',text:p.b}),
        p.sign&&h('p',{class:'sign',text:'— 드미트리 멘델레예프'})),
      h('div',{class:'l-foot'},h('div',{},dots,h('span',{class:'note',style:'color:var(--paper-mute);font-family:var(--f-mono)',text:(i+1)+' / '+LETTER.length})),btns));
    const f=paper.querySelector('[data-autofocus]'); if(f) f.focus({preventScroll:true});
  }
  draw('fwd');
  openModal(paper,{dismiss:false,onClose:()=>document.removeEventListener('keydown',onKey)});
  document.addEventListener('keydown',onKey);
}

/* ======================= FLOW ======================= */
function startGame(){
  prog.cleared.clear(); prog.cur=1;
  M1.placed.clear(); M1.star=false; M1.sel=null; M1.mistakes=0;
  M2.seen.clear(); M2.g=null; M2.z=null;
  M3.state='idle';
  $('#start').hidden=true; $('#game').hidden=false; $('#brand').hidden=false; $('#btnHome').hidden=false;
  $('#who').textContent='학번 '+player.id+' · '+player.name;
  paintMissions(); renderM1(); window.scrollTo(0,0);
}
function toHome(){
  stopM3(); closeModal(true);
  $('#game').hidden=true; $('#start').hidden=false; $('#brand').hidden=true; $('#btnHome').hidden=true;
  $('#sid').value=''; $('#sname').value=''; $('#err').textContent=''; window.scrollTo(0,0);
}
function paintFoot(){ $('#foot').textContent=DB()?'점수는 온라인 랭킹에 올라가요. 랭킹에는 학번과 이름 일부(예: 홍*동)가 보여요.':'점수 기록은 이 기기의 브라우저에 저장돼요.'; }
window.addEventListener('ptm-db-ready',paintFoot); paintFoot();
$('#btnHome').addEventListener('click',toHome);
$('#form').addEventListener('submit',e=>{
  e.preventDefault();
  const id=$('#sid').value.trim(), name=$('#sname').value.trim().replace(/\s+/g,' '), err=$('#err');
  if(!/^\d{3,8}$/.test(id)){ err.textContent='학번은 숫자 3~8자리로 입력해 주세요. (예: 20315)'; $('#sid').focus(); return; }
  if(name.length<2){ err.textContent='실명을 2글자 이상 입력해 주세요.'; $('#sname').focus(); return; }
  if(/\d/.test(name)){ err.textContent='실명에는 숫자를 쓸 수 없어요.'; $('#sname').focus(); return; }
  err.textContent=''; player.id=id; player.name=name; openLetter();
});
})();

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, collection, query, orderBy, limit, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBGwuTuoinkvME7QxnoEqkYzLSURjfsDrg",
    authDomain: "periodictable-eccea.firebaseapp.com",
    projectId: "periodictable-eccea",
    storageBucket: "periodictable-eccea.firebasestorage.app",
    messagingSenderId: "33487374673",
    appId: "1:33487374673:web:d15371e62fd0791b286b70"
  };

  /* 온라인 랭킹: Firestore의 ranking 컬렉션 (문서 ID = 학번)
     공개 항목은 학번, 이름 한 글자만 가린 이름(홍*동), 점수뿐이에요. 실명 전체는 저장하지 않아요.
     Firebase에 연결할 수 없으면 페이지가 이 기기 저장 방식으로 자동 전환돼요. */
  const maskName = n => {
    const a = Array.from(String(n).trim());
    if (a.length <= 1) return a.join('');
    a[1] = '*';                       // 두 번째 글자 한 개만 가림: 홍길동 → 홍*동, 김수 → 김*
    return a.join('');
  };

  try {
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const rankCol = () => collection(db, 'ranking');
    const toRows = snap => snap.docs.map(d => ({
      id: d.id, sid: String(d.data().sid || d.id), name: String(d.data().name || ''),
      score: Number(d.data().score) || 0, correct: Number(d.data().correct) || 0
    }));
    const topQuery = n => query(rankCol(), orderBy('score', 'desc'), limit(n));
    const api = {
      idOf: sid => String(sid),
      async top(n) { return toRows(await getDocs(topQuery(n))); },
      subscribeTop(n, cb, err) { return onSnapshot(topQuery(n), s => cb(toRows(s)), e => { if (err) err(e); }); },
      async submit(r) {
        const id = String(r.sid), ref = doc(db, 'ranking', id), cur = await getDoc(ref);
        let improved = true, best = r.score;
        if (cur.exists() && Number(cur.data().score) >= r.score) { improved = false; best = Number(cur.data().score); }
        else await setDoc(ref, { sid: id, name: maskName(r.name), score: r.score, correct: r.correct, best: r.best, t: serverTimestamp() });
        const list = await api.top(50), i = list.findIndex(x => x.id === id);
        return { improved, best, rank: i >= 0 ? i + 1 : null };
      }
    };
    window.PTM_DB = api;
    window.dispatchEvent(new Event('ptm-db-ready'));
  } catch (e) { console.warn('Firebase를 시작하지 못해 이 기기 저장 방식으로 동작해요.', e); }
</script>
